<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eduraa Choose Path — Five Concepts</title>
  <style>
    :root{--navy:#07152d;--navy2:#10223d;--cream:#fbf6ec;--paper:#fffdf8;--orange:#f36c21;--rust:#c2410c;--ink:#101828;--muted:#667085;--line:#e0d6c8}*{box-sizing:border-box}body{margin:0;background:#dde2e6;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.page{padding:54px 28px 86px}.head{width:min(1260px,100%);margin:0 auto 32px}.kicker{color:var(--rust);font-size:10px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase}.head h1{margin:8px 0 0;color:var(--navy);font:400 38px/1.1 Georgia,serif}.head p{max-width:640px;margin:9px 0 0;color:var(--muted);font-size:13px;line-height:20px}.grid{width:min(1260px,100%);margin:auto;display:grid;grid-template-columns:repeat(2,390px);justify-content:center;gap:42px}.wrap{width:390px}.meta{min-height:76px;padding:0 4px 13px}.meta span{color:var(--rust);font-size:9px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.meta h2{margin:5px 0 0;font:600 19px/23px Georgia,serif}.meta p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:16px}.phone{--bg:var(--cream);--fg:var(--navy);--sub:var(--muted);--border:var(--line);width:390px;height:844px;overflow:hidden;position:relative;border:1px solid rgba(7,21,45,.1);border-radius:38px;color:var(--fg);background:var(--bg);box-shadow:0 30px 80px rgba(7,21,45,.2)}.inside{height:100%;position:relative;z-index:2;padding:24px 20px 28px}.top{min-height:44px;display:flex;align-items:center;gap:9px}.back{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;color:var(--fg);background:rgba(255,255,255,.9);box-shadow:0 5px 14px rgba(7,21,45,.08);font-size:18px}.brand{display:flex;align-items:center;gap:8px}.brand img{width:40px;height:40px;object-fit:contain}.brand b{display:block;font-size:15px}.brand small{display:block;margin-top:1px;color:var(--sub);font-size:10px}.step{margin-left:auto;padding:7px 10px;border-radius:999px;color:#9a3412;background:#fff0e5;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.intro{padding:23px 0 19px}.ey{color:var(--rust);font-size:10px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase}.intro h3{margin:7px 0 0;font:400 30px/1.12 Georgia,serif;letter-spacing:-.5px}.intro p{margin:7px 0 0;color:var(--sub);font-size:13px;line-height:19px}.paths{display:grid;gap:12px}.path{min-height:166px;position:relative;display:flex;gap:14px;padding:19px;border:1px solid var(--border);border-radius:24px;color:inherit;background:#fff;text-align:left;overflow:hidden;transition:transform .18s,box-shadow .18s}.path:hover{transform:translateY(-2px)}.icon{width:45px;height:45px;flex:0 0 45px;display:grid;place-items:center;border-radius:14px;color:#fff;background:var(--navy);font-size:19px}.path:nth-child(2) .icon{border:1px solid var(--line);color:var(--rust);background:#fff}.copy{flex:1}.copy b{display:block;color:var(--rust);font-size:11px}.copy h4{margin:3px 0 0;font:600 19px/23px Georgia,serif}.copy p{margin:6px 15px 0 0;color:var(--sub);font-size:11px;line-height:17px}.go{position:absolute;right:17px;bottom:17px;color:var(--orange);font-weight:900}.foot{margin-top:23px;text-align:center;color:var(--sub);font-size:10px;line-height:25px}.foot b{color:var(--rust)}
    .horizon{background:linear-gradient(180deg,#fbf6ec 0 31%,#07152d 31%)}.horizon .paths{margin-top:5px}.horizon .path{border-color:rgba(255,255,255,.13);color:#fff;background:var(--navy2);box-shadow:0 15px 34px rgba(0,0,0,.17)}.horizon .path:nth-child(2){border-color:var(--line);color:var(--navy);background:var(--paper)}.horizon .path:first-child .icon{color:var(--navy);background:var(--orange)}.horizon .path:first-child p{color:#aab5c6}.horizon .foot{color:#aab5c6}
    .editorial .inside{padding-inline:0}.editorial .top,.editorial .intro,.editorial .foot{margin-inline:20px}.editorial .paths{gap:0}.editorial .path{min-height:188px;border:0;border-radius:0;padding:24px 20px}.editorial .path:first-child{color:#fff;background:var(--navy)}.editorial .path:first-child p{color:#aab5c6}.editorial .path:first-child .icon{color:var(--navy);background:#ffbf33}.editorial .path:nth-child(2){background:#fff0e5}.editorial .path::after{content:'';position:absolute;right:-42px;top:-52px;width:150px;height:150px;border:1px solid currentColor;border-radius:50%;opacity:.1}
    .orbit{background:radial-gradient(circle at 84% 17%,rgba(243,108,33,.2),transparent 25%),var(--cream)}.orbit::before{content:'';position:absolute;left:49px;top:283px;width:1px;height:260px;background:linear-gradient(var(--orange),var(--navy));opacity:.4}.orbit::after{content:'';position:absolute;left:42px;top:320px;width:15px;height:15px;border:3px solid var(--cream);border-radius:50%;background:var(--orange);box-shadow:0 189px 0 -2px var(--navy)}.orbit .paths{gap:20px}.orbit .path{min-height:156px;margin-left:25px;border-radius:18px 28px 28px 18px;box-shadow:0 15px 38px rgba(7,21,45,.09)}.orbit .path:first-child{border-color:rgba(243,108,33,.24);background:#fff8f1}.orbit .path:nth-child(2){border-color:rgba(7,21,45,.16);background:#fff}.orbit .icon{display:none}.orbit .path::before{content:'';position:absolute;left:0;inset-block:0;width:5px;background:var(--orange)}.orbit .path:nth-child(2)::before{background:var(--navy)}
    .soft{background:radial-gradient(circle at 94% 6%,rgba(255,191,51,.36),transparent 24%),radial-gradient(circle at -5% 49%,rgba(243,108,33,.22),transparent 29%),#fffaf2}.soft .intro{padding-bottom:26px}.soft .path{min-height:171px;border-color:rgba(194,65,12,.14);border-radius:29px;background:rgba(255,255,255,.85);box-shadow:0 19px 43px rgba(123,60,20,.11);backdrop-filter:blur(8px)}.soft .path:first-child{transform:rotate(-.55deg)}.soft .path:nth-child(2){transform:rotate(.55deg)}.soft .path:first-child .icon{color:var(--navy);background:var(--orange)}.soft .path::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--orange)}.soft .path:nth-child(2)::before{background:var(--navy)}
    .midnight{--bg:#07152d;--fg:#f8fafc;--sub:#aab5c6;--border:rgba(255,255,255,.14);background:#07152d}.midnight::before{content:'';position:absolute;right:-90px;top:-90px;width:290px;height:290px;border-radius:50%;background:rgba(243,108,33,.16)}.midnight::after{content:'';position:absolute;inset:210px 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(243,108,33,.5),transparent)}.midnight .back{color:#fff;background:rgba(255,255,255,.08)}.midnight .step{color:#ffd4bd;background:rgba(243,108,33,.15)}.midnight .ey{color:#ff8a4d}.midnight .path{border-color:rgba(255,255,255,.12);color:#fff;background:#10223d;box-shadow:0 16px 38px rgba(0,0,0,.22)}.midnight .path:nth-child(2){border-color:var(--line);color:var(--navy);background:var(--cream)}.midnight .path:first-child .icon{color:var(--navy);background:var(--orange)}.midnight .path:first-child p{color:#aab5c6}.midnight .path:nth-child(2) p{color:var(--muted)}
    .round-two{grid-column:1/-1;margin:22px 0 -10px;padding:27px 4px 0;border-top:1px solid rgba(7,21,45,.12)}.round-two span{color:var(--rust);font-size:10px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase}.round-two h2{margin:7px 0 0;font:400 30px/1.1 Georgia,serif}.round-two p{max-width:650px;margin:7px 0 0;color:var(--muted);font-size:12px;line-height:18px}
    .lens{background:linear-gradient(165deg,#fffaf2 0 51%,#07152d 51%)}.lens .lens-question{margin-top:26px;padding:24px 22px 26px;border-radius:28px;color:#fff;background:linear-gradient(145deg,#10223d,#07152d);box-shadow:0 22px 45px rgba(7,21,45,.22)}.lens .lens-question .ey{color:#ff8a4d}.lens .lens-question h3{margin:8px 0 0;font:400 29px/1.1 Georgia,serif}.lens .lens-question p{margin:8px 0 0;color:#aab5c6;font-size:12px;line-height:18px}.lens .featured{min-height:194px;margin-top:18px;padding:21px;border-radius:25px;color:var(--navy);background:var(--cream);box-shadow:0 18px 35px rgba(0,0,0,.18)}.lens .featured h4{margin:13px 0 0;font:600 22px Georgia,serif}.lens .featured p{color:var(--muted);font-size:11px;line-height:17px}.lens .compact-choice{width:100%;min-height:83px;display:flex;align-items:center;gap:12px;margin-top:12px;padding:13px 16px;border:1px solid rgba(255,255,255,.16);border-radius:20px;color:#fff;background:rgba(255,255,255,.07);text-align:left}.lens .compact-choice b{display:block;font:600 16px Georgia,serif}.lens .compact-choice small{display:block;margin-top:3px;color:#aab5c6}
    .portals{background:#07152d}.portals .top{color:#fff}.portals .back{color:#fff;background:rgba(255,255,255,.08)}.portals .brand small{color:#aab5c6}.portals .portal-title{padding:25px 0 19px;color:#fff}.portals .portal-title h3{margin:7px 0 0;font:400 30px Georgia,serif}.portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:500px}.portal{position:relative;overflow:hidden;padding:18px 15px;border:1px solid rgba(255,255,255,.13);border-radius:28px;color:#fff;background:#10223d;text-align:left}.portal.alt{color:var(--navy);background:var(--cream)}.portal-orb{width:76px;height:76px;display:grid;place-items:center;margin:7px auto 0;border-radius:50%;color:var(--navy);background:var(--orange);font-size:27px;box-shadow:0 0 0 14px rgba(243,108,33,.09)}.portal.alt .portal-orb{border:1px solid var(--line);color:var(--rust);background:#fff}.portal-copy{position:absolute;inset:auto 15px 20px}.portal-copy span{color:#ff8a4d;font-size:9px;font-weight:900}.portal.alt .portal-copy span{color:var(--rust)}.portal-copy h4{margin:5px 0 0;font:600 20px/22px Georgia,serif}.portal-copy p{margin:8px 0 0;color:#aab5c6;font-size:10px;line-height:15px}.portal.alt .portal-copy p{color:var(--muted)}
    .constellation{background:#07152d}.constellation::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 34%,rgba(243,108,33,.9) 0 2px,transparent 3px),radial-gradient(circle at 75% 54%,rgba(255,191,51,.8) 0 2px,transparent 3px),radial-gradient(circle at 53% 72%,rgba(255,255,255,.55) 0 1px,transparent 2px);background-size:94px 112px,128px 146px,78px 96px;opacity:.28}.constellation .top{color:#fff}.constellation .back{color:#fff;background:rgba(255,255,255,.08)}.constellation .brand small{color:#aab5c6}.constellation .intro{color:#fff}.constellation .intro p{color:#aab5c6}.constellation-map{position:relative;height:460px}.constellation-map svg{position:absolute;inset:0;width:100%;height:100%}.star-choice{position:absolute;width:156px;height:156px;display:grid;place-items:center;padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:50%;color:#fff;background:#10223d;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.25)}.star-choice.one{left:4px;top:25px}.star-choice.two{right:2px;bottom:26px;color:var(--navy);background:var(--cream)}.star-choice b{font:600 17px/19px Georgia,serif}.star-choice small{display:block;margin-top:7px;color:#aab5c6;font-size:9px;line-height:13px}.star-choice.two small{color:var(--muted)}
    .index{background:#fffaf2}.index .index-hero{margin:23px -20px 0;padding:25px 20px 28px;border-bottom:1px solid var(--line)}.index .index-hero h3{max-width:280px;margin:9px 0 0;font:400 35px/1.05 Georgia,serif}.index-list{margin:0 -20px}.index-row{width:100%;min-height:184px;display:grid;grid-template-columns:58px 1fr 28px;gap:10px;align-items:start;padding:23px 20px;border:0;border-bottom:1px solid var(--line);color:var(--navy);background:transparent;text-align:left}.index-row:first-child{background:#07152d;color:#fff}.index-num{font:400 40px/1 Georgia,serif;color:var(--orange)}.index-row h4{margin:0;font:600 22px/25px Georgia,serif}.index-row b{display:block;margin-bottom:5px;color:var(--rust);font-size:10px}.index-row:first-child b{color:#ff8a4d}.index-row p{margin:7px 0 0;color:var(--muted);font-size:10px;line-height:15px}.index-row:first-child p{color:#aab5c6}
    .sheet{background:linear-gradient(180deg,#07152d 0 38%,#f3ece4 38%)}.sheet .top{color:#fff}.sheet .back{color:#fff;background:rgba(255,255,255,.08)}.sheet .brand small{color:#aab5c6}.sheet .sheet-hero{padding:29px 4px 34px;color:#fff}.sheet .sheet-hero .ey{color:#ff8a4d}.sheet .sheet-hero h3{margin:8px 0 0;font:400 32px Georgia,serif}.choice-sheet{margin:0 -10px;padding:10px 10px 20px;border-radius:30px 30px 0 0;background:#fbf6ec}.grabber{width:38px;height:4px;margin:0 auto 15px;border-radius:999px;background:#d4c8b8}.sheet-choice{width:100%;min-height:146px;display:flex;align-items:center;gap:15px;padding:18px;border:1px solid var(--line);border-radius:22px;color:var(--navy);background:#fff;text-align:left;box-shadow:0 10px 25px rgba(7,21,45,.06)}.sheet-choice+.sheet-choice{margin-top:10px}.sheet-choice:first-of-type{border-color:rgba(243,108,33,.25);background:#fff7ed}.sheet-choice .badge{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:16px;color:#fff;background:var(--navy)}.sheet-choice:first-of-type .badge{color:var(--navy);background:var(--orange)}.sheet-choice h4{margin:0;font:600 19px Georgia,serif}.sheet-choice p{margin:6px 0 0;color:var(--muted);font-size:10px;line-height:15px}
    @media(max-width:900px){.page{padding-inline:16px}.grid{display:flex;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:22px}.wrap{flex:0 0 390px;scroll-snap-align:start}}@media(max-width:430px){.page{padding:28px 0 60px}.head{padding-inline:18px}.grid{padding-inline:18px}.wrap{flex-basis:360px;width:360px}.phone{width:360px}.inside{padding-inline:17px}.editorial .top,.editorial .intro,.editorial .foot{margin-inline:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main class="page">
  <header class="head"><div class="kicker">Single-screen design study</div><h1>Choose your path — five directions</h1><p>Each phone preserves the exact decision, wording, and outcomes. Only composition, color, depth, and brand expression change.</p></header>
  <section class="grid" id="gallery"></section>
</main>
<script>
const concepts=[['horizon','01','Intelligence Horizon','Closest continuation of the approved login.'],['editorial','02','Editorial Split','Strong full-width zones with decisive contrast.'],['orbit','03','Orbit Path','A distinctive learning-journey composition.'],['soft','04','Soft Signal','Warm, expressive and inviting with premium depth.'],['midnight','05','Midnight Focus','Cinematic, serious and intelligence-led.'],['break','','Round two','Stronger ideas with genuinely different decision metaphors.'],['lens','06','Guided Lens','A featured recommendation with a quieter alternative.'],['portals','07','Twin Portals','Two immersive identity destinations.'],['constellation','08','Learning Constellation','An AI-network path instead of conventional cards.'],['index','09','Editorial Index','Typography-led, decisive and minimal.'],['sheet','10','Choice Sheet','A tactile mobile-native selection surface.']];
const headerMarkup=`<header class="top"><button class="back" aria-label="Back to sign in">←</button><div class="brand"><img src="assets/eduraa-book-brain.png" alt=""><span><b>Eduraa AI</b><small>Create your account</small></span></div><span class="step">01 · Choose</span></header>`;
const standard=(style)=>`<article class="phone ${style}"><div class="inside">${headerMarkup}<section class="intro"><div class="ey">Your learning relationship</div><h3>Choose your path.</h3><p>Who should shape your Eduraa experience?</p></section><div class="paths"><button class="path"><span class="icon">♙</span><span class="copy"><b>Learn on my terms</b><h4>Individual learner</h4><p>Your own space, shaped around your goals and pace.</p></span><span class="go">→</span></button><button class="path"><span class="icon">⌂</span><span class="copy"><b>Learn with my institution</b><h4>Institution workspace</h4><p>Verify your school membership as a student, teacher, or principal.</p></span><span class="go">→</span></button></div><footer class="foot">◇ Preferences can be updated later.<br>Already learning with Eduraa? <b>Sign in</b></footer></div></article>`;
const phone=(s)=>{if(!['lens','portals','constellation','index','sheet'].includes(s))return standard(s);if(s==='lens')return `<article class="phone lens"><div class="inside">${headerMarkup}<section class="lens-question"><div class="ey">Let’s find your fit</div><h3>Who leads your learning?</h3><p>Choose the relationship that should shape your Eduraa experience.</p></section><button class="featured"><span class="icon">♙</span><h4>Individual learner</h4><p>Your goals, your pace, your own intelligent learning space.</p><span class="go">Continue →</span></button><button class="compact-choice"><span class="icon">⌂</span><span><b>Institution workspace</b><small>Connect with your school or institute</small></span><span class="go">→</span></button></div></article>`;if(s==='portals')return `<article class="phone portals"><div class="inside">${headerMarkup}<section class="portal-title"><div class="ey">Your learning relationship</div><h3>Step into your space.</h3></section><div class="portal-grid"><button class="portal"><span class="portal-orb">♙</span><span class="portal-copy"><span>On my terms</span><h4>Individual learner</h4><p>Goals and pace shaped around you.</p></span></button><button class="portal alt"><span class="portal-orb">⌂</span><span class="portal-copy"><span>With my institution</span><h4>Institution workspace</h4><p>School membership and shared learning.</p></span></button></div></div></article>`;if(s==='constellation')return `<article class="phone constellation"><div class="inside">${headerMarkup}<section class="intro"><div class="ey">Your learning relationship</div><h3>Choose your orbit.</h3><p>Every learning path starts with who shapes the journey.</p></section><div class="constellation-map"><svg viewBox="0 0 350 460"><path d="M75 105 C210 90 145 350 280 360" fill="none" stroke="#f36c21" stroke-width="2" stroke-dasharray="5 8" opacity=".65"/></svg><button class="star-choice one"><span><b>Individual learner</b><small>My goals. My pace. My space.</small></span></button><button class="star-choice two"><span><b>Institution workspace</b><small>My school. My role. Connected learning.</small></span></button></div></div></article>`;if(s==='index')return `<article class="phone index"><div class="inside">${headerMarkup}<section class="index-hero"><div class="ey">Your learning relationship</div><h3>Choose what shapes your experience.</h3></section><div class="index-list"><button class="index-row"><span class="index-num">01</span><span><b>Learn on my terms</b><h4>Individual learner</h4><p>Your own space, shaped around your goals and pace.</p></span><span>→</span></button><button class="index-row"><span class="index-num">02</span><span><b>Learn with my institution</b><h4>Institution workspace</h4><p>Student, teacher, or principal connected to a branch.</p></span><span>→</span></button></div></div></article>`;return `<article class="phone sheet"><div class="inside">${headerMarkup}<section class="sheet-hero"><div class="ey">One quick choice</div><h3>How do you learn?</h3></section><section class="choice-sheet"><div class="grabber"></div><button class="sheet-choice"><span class="badge">♙</span><span><h4>On my own terms</h4><p>Build a personal Eduraa space around your goals and pace.</p></span><span>→</span></button><button class="sheet-choice"><span class="badge">⌂</span><span><h4>With my institution</h4><p>Join as a student, teacher, or principal through your branch.</p></span><span>→</span></button><footer class="foot">Preferences can be changed later.<br>Already have an account? <b>Sign in</b></footer></section></div></article>`};
document.getElementById('gallery').innerHTML=concepts.map(([style,n,title,description])=>style==='break'?`<header class="round-two"><span>Round two</span><h2>More ambitious directions</h2><p>${description}</p></header>`:`<div class="wrap"><header class="meta"><span>Direction ${n}</span><h2>${title}</h2><p>${description}</p></header>${phone(style)}</div>`).join('');
</script>
</body>
</html>
